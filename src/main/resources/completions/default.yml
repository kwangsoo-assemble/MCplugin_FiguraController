# FiguraController — /fc 탭 자동완성
#
# 이 폴더(completions/)의 *.yml 을 **전부 합쳐** 쓴다 — 파일 이름 순 · 파일 안은 적은 순.
# 콘텐츠마다 파일 하나를 두면 된다(예: verity.yml). 저장하면 다음 탭부터 바로 반영된다(재시작 없음).
# 잘못 적은 칸은 건너뛰고 서버 콘솔에 한 번 알린다 — `/fc status` 끝 줄에 경고 수가 나온다.
#
#   lists:    이름 붙인 값 목록 — 아래 후보에서 $이름 으로 부른다
#   states:   상태 이름 → 값 후보       (/fc state set <대상> <이름> <값>)
#   signals:  신호 이름 → 데이터 후보    (/fc signal <대상> <이름> [데이터])
#
# 이름 칸: 정확한 이름 · `*` 는 아무 글자 · `|` 로 여럿          예) skin   "*Name"   nickName|plateName
#   ⚠ `*` 로 시작하는 이름은 따옴표로 감싼다("*Name") — YAML 이 별칭으로 읽는다
#   ★ 여기 정확히 적은 이름은 아직 아무도 그 상태를 안 가졌어도 이름 자동완성에 뜬다
#
# 후보 하나:
#   글자 그대로   RATH4R · true · 3 · null · '"띄어 쓴 글"' · '{"x":1}'    ← 적은 그대로 명령에 들어간다
#                 (따옴표 없이 적은 글도 글자 그대로다 — on · no · 1:30 이 불 · 수로 바뀌지 않는다)
#                 ⚠ [ 나 { 로 시작하는 JSON 값은 작은따옴표로 감싼다
#   $목록이름     lists 의 목록
#   $online       지금 접속한 플레이어 이름
#   $used         지금 누가(전역 · 플레이어 · 몹) 그 상태에 가진 값들 — 상태에만
#   0..5          정수 범위 (200개까지)
#   $$글          $ 로 시작하는 글자 그대로
#
# 규칙이 없는 상태는 true · false · null 이 뜬다. 후보를 하나도 안 띄우려면 [] 를 적는다.

lists:
  # 정본: CH includes/system/libraries/utils.ms 의 _get_default_nickname (하네스 knowledge/shared/production_rules.md §1)
  #       탤런트가 바뀌면 같이 고친다
  talentAccount: [RATH4R, DUCKGAE, Heptagram, ehdgh141, Sleepground, SUHYEN, herb_o, gosxo, komq, MinedApple, FGcounter, GGUMONG, ParkMo, U_Seong]
  talentKorean:  [라더, 덕개, 각별, 공룡, 잠뜰, 수현, 쁘허, 태경, 코마, 마인애플, 카운터, 꾸몽, 파크모, 유성]

states:
  skin: [$talentAccount, null]
  nickName|listName|chatName|plateName: [$talentKorean, null]
  isArmWide: [true, false, null]
  showNametag: [true, false]

# signals:
#   SCREENSHAKE: ['{"power":1}', '{"power":3}']
